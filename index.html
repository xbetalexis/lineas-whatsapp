<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Líneas de WhatsApp</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;

      background-image: url("fondo.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .contenedor {
      width: 90%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .boton {
      display: block;
      width: 100%;
      padding: 18px;
      text-align: center;
      text-decoration: none;
      font-size: 22px;
      font-weight: bold;
      border-radius: 15px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      border: 2px solid white;
      transition: 0.2s;
    }

    .boton:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <a
      class="boton"
      href="https://wa.me/5491162430461"
      target="_blank"
    >
      LÍNEA 1
    </a>

    <a
      class="boton"
      href="https://wa.me/5491155157167"
      target="_blank"
    >
      LÍNEA 2
    </a>

    <a
      class="boton"
      href="https://whatsapp.com/channel/0029VbDe2GXEQIao4NLZ2b1O"
      target="_blank"
    >
      CANAL DE WHATSAPP
    </a>

  </div>

</body>
</html>
